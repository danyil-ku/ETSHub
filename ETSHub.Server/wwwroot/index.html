<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- PWA meta tags: fullscreen web app mode on iPad without Safari UI -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ETSHub Controller</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="top-bar">
        <h1 class="logo">ETSHub <span>Control Panel</span></h1>
        <div id="status" class="status-badge disconnected">● Disconnected</div>
    </header>

    <main class="dashboard-grid">
        <!-- Button 1: Engine Start/Stop -->
        <button class="btn btn-primary" data-button="1">
            <img src="assets/engine.png" alt="Engine" class="btn-icon">
        </button>

        <!-- Button 2: Vehicle Electrics / Ignition Switch -->
        <button class="btn" data-button="2">
            <img src="assets/EngineStart - Natural.svg" alt="Ignition" class="btn-icon">
        </button>

        <!-- Button 3: Hazard Warning Lights -->
        <button class="btn btn-warning" data-button="3">
            <img src="assets/hazard copy.png" alt="Hazard" class="btn-icon">
        </button>

        <!-- Button 4: Lane Keeping Assist -->
        <button class="btn" data-button="4">
            <img src="assets/lane-keeping-1.png" alt="Lane Keeping" class="btn-icon">
        </button>

        <!-- Button 5: Warning Beacons -->
        <button class="btn btn-warning" data-button="5">
            <img src="assets/beacon.png" alt="Beacons" class="btn-icon">
        </button>

        <!-- Button 6: Dashboard Map Zoom Mode -->
        <button class="btn" data-button="6">
            <img src="assets/navi-zoom-mode.png" alt="Map Zoom" class="btn-icon">
        </button>

        <!-- Button 7: Truck Lift Axle -->
        <button class="btn" data-button="7">
            <img src="assets/lift-axle-truck.png" alt="Lift Axle" class="btn-icon">
        </button>

        <!-- Button 8: Differential Lock -->
        <button class="btn" data-button="8">
            <img src="assets/diff-lock.png" alt="Diff Lock" class="btn-icon">
        </button>

        <!-- Button 9: World Map -->
        <button class="btn" data-button="9">
            <img src="assets/map.png" alt="Map" class="btn-icon">
        </button>

        <!-- Button 10: Trailer Coupling -->
        <button class="btn" data-button="10">
            <img src="assets/coupling.png" alt="Coupling" class="btn-icon">
        </button>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
